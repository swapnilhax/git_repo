name: Python CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Get my code
        uses: actions/checkout@v4

      - name: Step 2 - Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 3 - Install packages
        run: pip install -r requirements.txt

      - name: Step 4 - Run tests
        run: pytest tests/ --verbose
